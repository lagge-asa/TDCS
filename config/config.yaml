service:
  instance_id: dev_instance_1
  log_level: INFO
database:
  master:
    host: 127.0.0.1
    port: 3306
    user: etl_user
    password: ${DB_MASTER_PASSWORD}
    database: etl_db
    pool_size: 5
    pool_timeout: 30
    pool_recycle: 3600
    connect_timeout: 10
    auth_plugin: caching_sha2_password
  slaves: []
cache:
  local:
    enabled: true
    maxsize: 1000
    ttl: 300
  redis:
    enabled: true
    host: 127.0.0.1
    port: 6379
    password: ''
    db: 0
concurrency:
  worker_threads: 4
  queue_maxsize: 500
  task_timeout: 300
encryption:
  enabled: false
  algorithm: fernet
  key_env: ETL_ENCRYPTION_KEY
high_availability:
  enabled: false
  heartbeat_interval: 10
  failover_timeout: 30
  degraded_mode: pause
web:
  enabled: true
  host: 0.0.0.0
  port: 8080
  secret_key: ${WEB_SECRET_KEY}
  token_expire_hours: 8
  rate_limit: 200 per minute
  server: waitress
  threads: 4
monitoring:
  prometheus:
    enabled: true
    port: 9090
  alerting:
    enabled: false
tasks: []
