# Alembic 数据库迁移配置
# 使用方式:
#   cd etl-service
#   alembic upgrade head   # 迁移到最新
#   alembic downgrade -1   # 回滚一步
#   alembic revision --autogenerate -m "描述"   # 自动生成迁移

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = mysql+pymysql://placeholder:placeholder@localhost:3306/etl_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
